name: Streaks page

on:
  schedule:
    # Hourly from 10:17 to 00:17 CET (UTC times below). GitHub often drops or delays scheduled runs by
    # hours, so a run every hour keeps the page current; each one also picks up newly listed Kalshi lines.
    - cron: "17 9-23 * * *"
  workflow_dispatch:  # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python streaks.py --selftest
      # Fails (and leaves the live page as it was) if every league's data is unreachable.
      - run: mkdir -p site && python streaks.py --out site/index.html && test -s site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
